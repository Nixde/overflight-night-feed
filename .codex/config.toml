# Inherit user model, effort, execution permissions and subagent limits.
[mcp_servers.night_feed_github_read]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
http_headers = { "X-MCP-Readonly" = "true", "X-MCP-Toolsets" = "repos,issues,pull_requests,actions" }
enabled = false
required = false
